name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Copy APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" dist/Root-Discover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Root-Discover-APK
          path: dist/Root-Discover.apk

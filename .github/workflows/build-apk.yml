name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as a zip
        run: |
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do
            echo "Unzipping $z"
            unzip -o -q "$z" -d unzipped
          done
          echo "--- Files in repository ---"
          find . -not -path "./.git/*" -maxdepth 4 | head -100

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            echo "::error::Project files not found. Upload RootDiscover.zip (or the unzipped folder) to the repository."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Copy APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" dist/Root-Discover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Root-Discover-APK
          path: dist/Root-Discover.apk
